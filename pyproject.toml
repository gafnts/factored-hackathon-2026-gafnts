[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.7,<0.11" ]

[project]
name = "banking-agent"
version = "0.1.0"
description = "AI-first banking customer service agent for the Factored AI & Data Hackathon 2026"
readme = "README.md"
license = "MIT"
requires-python = "~=3.13.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "boto3[crt]>=1.43.103",
  "duckdb>=1.5.5",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3,sts]>=1.43.103",
  "jsonschema>=4.26",
  "moto[s3]>=5.2.3",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pyproject-fmt>=2.29.4",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-timeout>=2.4",
  "rfc3339-validator>=0.1.4",
  "ruff>=0.16.9",
  "shellcheck-py>=0.11.0.1",
  "types-jsonschema>=4.26.0.20260518",
]
eda = [
  "matplotlib>=3.11.2",
  "plotnine>=0.15.8",
  "polars>=1.44.2",
  "pyarrow>=25.0.1",
  "scikit-learn>=1.9.1",
]

[tool.uv]
default-groups = [ "dev", "eda" ]

[tool.ruff]
src = [ "src" ]
lint.select = [ "B", "E4", "E7", "E9", "F", "G", "I", "N", "SIM", "UP" ]

[tool.mypy]
mypy_path = "src"
files = [ "src", "tests" ]
strict = true
overrides = [
  { module = "tests.*", disallow_untyped_defs = false },
  { module = "sklearn.*", ignore_missing_imports = true },
  { module = [
    "banking_agent.analysis.cards_figures",
    "banking_agent.analysis.figures",
    "banking_agent.analysis.plotting",
  ], disallow_untyped_calls = false },
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-m 'not integration'"
ini_options.markers = [
  "integration: requires credentials and network access (deselected by default)",
]
ini_options.timeout = 120

[tool.coverage]
run.source = [ "src" ]
run.branch = true
report.fail_under = 80
report.show_missing = true
