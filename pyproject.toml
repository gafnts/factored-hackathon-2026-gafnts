[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.7,<0.11" ]

[project]
name = "banking-agent"
version = "0.1.0"
description = "AI-first banking customer service agent for the Factored AI & Data Hackathon 2026"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pyproject-fmt>=2.29.4",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-timeout>=2.4",
  "ruff>=0.16.9",
  "shellcheck-py>=0.11.0.1",
]

[tool.ruff]
target-version = "py313"
src = [ "src" ]
lint.select = [ "B", "E4", "E7", "E9", "F", "G", "I", "N", "SIM", "UP" ]

[tool.mypy]
mypy_path = "src"
files = [ "src", "tests" ]
strict = true
overrides = [
  { module = "tests.*", disallow_untyped_defs = false },
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-m 'not integration'"
ini_options.markers = [
  "integration: requires credentials and network access (deselected by default)",
]
ini_options.timeout = 120

[tool.coverage]
run.source = [ "src" ]
run.branch = true
report.fail_under = 80
report.show_missing = true
