default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^docs/analysis/figures/.*\.svg$
      - id: check-yaml
        # pnpm's lockfile holds its own dependencies in a second document.
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        # One line per dataset file, about 1.5 MB.
        exclude: ^dataset\.lock$
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false
          - --env-vars=AWS_REGION=us-east-1
          # Directories init in parallel, and two inits filling a provider cache (CI sets one) can collide.
          - --hook-config=--retry-once-with-cleanup=true
        stages: [pre-push]
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_trivy
        stages: [pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      # The upstream hook scans only staged changes, so in CI it scans nothing.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full history)
        entry: gitleaks git --redact --verbose
        stages: [pre-push]
        always_run: true

  # Outputs can hold dataset rows, and the repo is public (SEC-03).
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: uv run shellcheck -x
        language: system
        types: [shell]

      - id: pyproject-fmt
        name: pyproject-fmt
        entry: uv run pyproject-fmt
        language: system
        files: pyproject\.toml$

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        language: system
        types: [python]
        entry: uv run pytest -n auto --cov --cov-report=term-missing
        pass_filenames: false
        stages: [pre-push]

      # The web app's tools run from web/node_modules, as ruff and mypy run from .venv; ESLint and Prettier find
      # web/'s configuration from each file, but Prettier reads ignores from where it runs.
      - id: prettier
        name: prettier (web)
        entry: web/node_modules/.bin/prettier --write --ignore-unknown --ignore-path web/.prettierignore
        language: system
        files: ^web/

      - id: eslint
        name: eslint (web)
        entry: web/node_modules/.bin/eslint --fix
        language: system
        files: ^web/.*\.(js|ts|tsx)$

      - id: tsc
        name: tsc (web)
        entry: pnpm --dir web typecheck
        language: system
        files: ^(web/|src/banking_agent/contracts/)
        pass_filenames: false

      - id: vitest
        name: vitest (web)
        entry: pnpm --dir web test
        language: system
        files: ^(web/|src/banking_agent/contracts/)
        pass_filenames: false
        stages: [pre-push]

      - id: vite-build
        name: vite build (web)
        entry: pnpm --dir web build
        language: system
        files: ^web/
        pass_filenames: false
        stages: [pre-push]
