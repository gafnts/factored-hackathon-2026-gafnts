# Monthly version updates, one grouped PR per ecosystem, into develop (main only
# accepts merges from develop). The cooldown skips releases younger than a week,
# so a compromised release is usually yanked before Dependabot proposes it;
# security updates ignore the cooldown.
#
# Not covered here: the Terraform CLI (.terraform-version), Python
# (.python-version), Node (.nvmrc), and the tool versions in the workflow
# `env` blocks.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: [/infra, /infra/iam]
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]
