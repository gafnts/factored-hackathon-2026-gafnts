name: Deploy · Demo

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/iam/**"
      - ".github/workflows/deploy-demo.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/iam/**"
      - ".github/workflows/deploy-demo.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Explicit bash gets -o pipefail, so `make plan | tee plan.txt` fails when the
# plan fails (the implicit default shell is plain `bash -e`).
defaults:
  run:
    shell: bash

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  ENV: demo
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.0

jobs:
  # Both jobs are skipped until their role ARN is set as a repository variable
  # (CONTRIBUTING.md, step 3.5), so the pipeline stays green before the
  # AWS side is bootstrapped.

  # PR plan (develop -> main): posts a sticky comment so reviewers can see what
  # the merge would change. Runs under the read-only demo-plan role.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN_DEMO_PLAN != ''
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEMO_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: terraform -chdir=infra fmt -check -recursive
      - run: make init ENV=${{ env.ENV }}

      - name: Plan
        id: plan
        env:
          TF_CLI_ARGS_plan: -no-color
        run: make plan ENV=${{ env.ENV }} 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Capture plan output
        if: always()
        id: planfile
        run: |
          {
            echo 'value<<EOF'
            head -c 60000 plan.txt
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: terraform-plan-demo
          message: |
            #### Terraform Plan · `demo` ${{ steps.plan.outcome == 'success' && '✅' || '❌' }}
            <details><summary>Show plan</summary>

            ~~~
            ${{ steps.planfile.outputs.value }}
            ~~~
            </details>

      - if: steps.plan.outcome == 'failure'
        run: exit 1

  # Post-merge apply. The `demo` GitHub Environment is the only OIDC subject the
  # demo deploy role trusts; restrict its deployment branches to main. Add
  # `url:` under `environment:` once the app has a public endpoint, and GitHub
  # will link the live demo from every deployment.
  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && vars.AWS_ROLE_ARN_DEMO != ''
    environment:
      name: demo
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEMO }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: make init ENV=${{ env.ENV }}

      - name: Apply
        run: |
          terraform -chdir=infra apply -auto-approve \
            -var-file=envs/${{ env.ENV }}.tfvars
