name: Deploy · Prototype

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/iam/**"
      - "!infra/dataset/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-prototype.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/iam/**"
      - "!infra/dataset/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-prototype.yml"
  workflow_dispatch:

permissions: {}

# Explicit bash adds -o pipefail, so `make plan | tee` fails when the plan does.
defaults:
  run:
    shell: bash

env:
  ENV: prototype
  AWS_REGION: us-east-1
  TF_VERSION: 1.16.4

jobs:
  # Read-only role and no state lock, so a plan never blocks an apply.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AWS_ROLE_ARN_PROTOTYPE_PLAN != ''
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    concurrency:
      group: deploy-prototype-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Full history, so the build stamps the Runtime with the commit that last changed its code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROTOTYPE_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: terraform -chdir=infra fmt -check -recursive
      - run: make init ENV=${{ env.ENV }}

      # make plan builds the zips first.
      - name: Plan
        id: plan
        env:
          TF_CLI_ARGS_plan: -no-color -lock=false
        run: make plan ENV=${{ env.ENV }} 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Capture plan output
        if: always()
        id: planfile
        run: |
          {
            echo 'value<<EOF'
            head -c 60000 plan.txt
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan
        if: always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terraform-plan-prototype
          message: |
            #### Terraform Plan · `prototype` ${{ steps.plan.outcome == 'success' && '✅' || '❌' }}
            <details><summary>Show plan</summary>

            ~~~
            ${{ steps.planfile.outputs.value }}
            ~~~
            </details>

      - if: steps.plan.outcome == 'failure'
        run: exit 1

  # The deploy role trusts only the `prototype` Environment (limit it to main).
  # Applies queue instead of cancelling; a newer pending run replaces an older one.
  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.AWS_ROLE_ARN_PROTOTYPE != ''
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prototype-apply
      cancel-in-progress: false
    environment:
      name: prototype
    steps:
      # Full history, so the build stamps the Runtime with the commit that last changed its code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROTOTYPE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: make init ENV=${{ env.ENV }}
      - run: make build

      - name: Apply
        run: |
          terraform -chdir=infra apply -auto-approve \
            -var-file=envs/${{ env.ENV }}.tfvars
