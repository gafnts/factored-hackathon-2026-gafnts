name: Deploy · Prototype

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/iam/**"
      - ".github/workflows/deploy-prototype.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/iam/**"
      - ".github/workflows/deploy-prototype.yml"
  # Manual redeploy from main (Actions, Run workflow): the first deploy after
  # the role ARN variables are set, or a re-apply without an infra change.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Explicit bash gets -o pipefail, so `make plan | tee plan.txt` fails when the
# plan fails (the implicit default shell is plain `bash -e`).
defaults:
  run:
    shell: bash

env:
  ENV: prototype
  AWS_REGION: us-east-1
  TF_VERSION: 1.16.4

jobs:
  # Both jobs are skipped until their role ARN is set as a repository variable
  # (CONTRIBUTING.md, step 3.5), so the pipeline stays green before the
  # AWS side is bootstrapped.

  # PR plan (develop -> main): posts a sticky comment so reviewers can see what
  # the merge would change. Runs under the read-only prototype-plan role, without
  # the state lock, so it never waits on an apply or leaves a stale lock behind.
  # Fork PRs get no OIDC token, so they skip it.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AWS_ROLE_ARN_PROTOTYPE_PLAN != ''
    concurrency:
      group: deploy-prototype-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROTOTYPE_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: terraform -chdir=infra fmt -check -recursive
      - run: make init ENV=${{ env.ENV }}

      - name: Plan
        id: plan
        env:
          TF_CLI_ARGS_plan: -no-color -lock=false
        run: make plan ENV=${{ env.ENV }} 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Capture plan output
        if: always()
        id: planfile
        run: |
          {
            echo 'value<<EOF'
            head -c 60000 plan.txt
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan
        if: always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terraform-plan-prototype
          message: |
            #### Terraform Plan · `prototype` ${{ steps.plan.outcome == 'success' && '✅' || '❌' }}
            <details><summary>Show plan</summary>

            ~~~
            ${{ steps.planfile.outputs.value }}
            ~~~
            </details>

      - if: steps.plan.outcome == 'failure'
        run: exit 1

  # Post-merge apply, or a manual redeploy from main. The `prototype` GitHub
  # Environment is the only OIDC subject the prototype deploy role trusts;
  # restrict its deployment branches to main. Add `url:` under `environment:`
  # once the app has a public endpoint, and GitHub will link the live prototype
  # from every deployment.
  #
  # Applies queue rather than cancel each other: a newer pending run replaces an
  # older pending one, which is safe because it applies a later commit.
  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.AWS_ROLE_ARN_PROTOTYPE != ''
    concurrency:
      group: deploy-prototype-apply
      cancel-in-progress: false
    environment:
      name: prototype
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROTOTYPE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: make init ENV=${{ env.ENV }}

      - name: Apply
        run: |
          terraform -chdir=infra apply -auto-approve \
            -var-file=envs/${{ env.ENV }}.tfvars
